name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      #- portfolio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the master branch (main site)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Create the deployment root directory
      - name: Create deployment directory
        run: mkdir -p deployment

      # Copy main site files to the root of deployment
      - name: Copy main site to deployment root
        run: |
          cp -r ./* deployment/ || true
          rm -rf deployment/.github deployment/.git

      # Checkout the second site branch into a subfolder
      # - name: Checkout portfolio branch
      #   uses: actions/checkout@v4
      #   with:
      #     ref: portfolio
      #     path: deployment/site2
      #     clean: false

      # Checkout the site/ folder from the technical-writing repo
      # Needs a PAT: the default GITHUB_TOKEN cannot read other repositories.
      - name: Checkout technical-writing repo
        uses: actions/checkout@v4
        with:
          repository: rkmanga/technical-writing
          token: ${{ secrets.TECHNICAL_WRITING_TOKEN }}
          path: deployment/_technical-writing-src
          sparse-checkout: |
            site
          sparse-checkout-cone-mode: false
          clean: false

      # Checkout the web_specialist_portfolio repo
      # Needs a PAT: uses PORTFOLIO_TOKEN if set, otherwise falls back to TECHNICAL_WRITING_TOKEN.
      - name: Checkout web_specialist_portfolio repo
        uses: actions/checkout@v4
        with:
          repository: rkmanga/web_specialist_portfolio
          token: ${{ secrets.PORTFOLIO_TOKEN || secrets.TECHNICAL_WRITING_TOKEN }}
          path: deployment/_portfolio-src
          clean: false

      # Promote technical-writing built site
      - name: Promote technical-writing built site
        run: |
          if [ -d "deployment/_technical-writing-src/site" ]; then
            mv deployment/_technical-writing-src/site deployment/technical-writing
          fi
          rm -rf deployment/_technical-writing-src

      # Publish website_specialist_portfolio page and accompanying assets
      - name: Publish website_specialist_portfolio
        run: |
          # Locate website_specialist_portfolio.html in _portfolio-src, main repo, etc.
          PORTFOLIO_SRC=""
          if [ -f "deployment/_portfolio-src/website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="deployment/_portfolio-src/website_specialist_portfolio.html"
          elif [ -f "deployment/_portfolio-src/docs/website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="deployment/_portfolio-src/docs/website_specialist_portfolio.html"
          elif [ -f "deployment/_portfolio-src/index.html" ]; then
            PORTFOLIO_SRC="deployment/_portfolio-src/index.html"
          elif [ -f "website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="website_specialist_portfolio.html"
          else
            FOUND=$(find deployment/_portfolio-src -name "website_specialist_portfolio.html" 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              PORTFOLIO_SRC="$FOUND"
            fi
          fi

          if [ -z "$PORTFOLIO_SRC" ] || [ ! -f "$PORTFOLIO_SRC" ]; then
            echo "Error: website_specialist_portfolio.html not found!"
            echo "Contents of deployment/_portfolio-src:"
            ls -la deployment/_portfolio-src || true
            exit 1
          fi

          echo "Found portfolio source at: $PORTFOLIO_SRC"

          # Create destination directory for website_specialist_portfolio
          mkdir -p deployment/website_specialist_portfolio

          # Copy any accompanying assets/files from the portfolio repo
          if [ -d "deployment/_portfolio-src" ]; then
            cp -r deployment/_portfolio-src/* deployment/website_specialist_portfolio/ 2>/dev/null || true
            rm -rf deployment/website_specialist_portfolio/.git
          fi

          # Publish to root /website_specialist_portfolio/index.html (clean URL) and /website_specialist_portfolio.html
          cp "$PORTFOLIO_SRC" deployment/website_specialist_portfolio/index.html
          cp "$PORTFOLIO_SRC" deployment/website_specialist_portfolio.html

          # Also support /web_specialist_portfolio/ URL (matching repository name)
          mkdir -p deployment/web_specialist_portfolio
          cp "$PORTFOLIO_SRC" deployment/web_specialist_portfolio/index.html
          cp "$PORTFOLIO_SRC" deployment/web_specialist_portfolio.html

          # Also publish under /technical-writing/ for backwards compatibility
          mkdir -p deployment/technical-writing/website_specialist_portfolio
          cp "$PORTFOLIO_SRC" deployment/technical-writing/website_specialist_portfolio/index.html
          cp "$PORTFOLIO_SRC" deployment/technical-writing/website_specialist_portfolio.html

          # Clean up temporary staging directory
          rm -rf deployment/_portfolio-src

      # Upload the combined deployment directory as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

      # Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4