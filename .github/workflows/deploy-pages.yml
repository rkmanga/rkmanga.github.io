name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      #- portfolio

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the master branch (main site)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Create the deployment root directory
      - name: Create deployment directory
        run: mkdir -p deployment

      # Copy main site files to the root of deployment
      - name: Copy main site to deployment root
        run: |
          cp -r ./* deployment/ || true
          rm -rf deployment/.github deployment/.git

      # Checkout the second site branch into a subfolder
      # - name: Checkout portfolio branch
      #   uses: actions/checkout@v4
      #   with:
      #     ref: portfolio
      #     path: deployment/site2
      #     clean: false

      # Checkout the technical-writing repo into a staging folder
      # Needs a PAT: the default GITHUB_TOKEN cannot read other repositories.
      - name: Checkout technical-writing repo
        uses: actions/checkout@v4
        with:
          repository: rkmanga/technical-writing
          token: ${{ secrets.TECHNICAL_WRITING_TOKEN }}
          path: deployment/_technical-writing-src
          clean: false

      # This repo is an MkDocs project: the built site (with index.html)
      # lives in its site/ subfolder, not at the repo root. Promote just
      # that built output into the deployment subfolder.
      - name: Promote technical-writing built site
        run: |
          mv deployment/_technical-writing-src/site deployment/technical-writing
          rm -rf deployment/_technical-writing-src

      # TEMPORARY DEBUG STEP: dump deployment dir listing to a public file
      # so it can be inspected via the live site without needing API auth.
      - name: Debug deployment listing
        run: |
          {
            echo "=== deployment top level ==="
            ls -la deployment
            echo "=== deployment/technical-writing exists? ==="
            ls -la deployment/technical-writing 2>&1
            echo "=== find (first 100) ==="
            find deployment -maxdepth 3 | sort | head -100
          } > deployment/_debug.txt

      # Upload the combined deployment directory as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

      # Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
