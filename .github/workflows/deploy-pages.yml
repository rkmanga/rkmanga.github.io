name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      #- portfolio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the master branch (main site)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Create the deployment root directory
      - name: Create deployment directory
        run: mkdir -p deployment

      # Copy main site files to the root of deployment
      - name: Copy main site to deployment root
        run: |
          cp -r ./* deployment/ || true
          rm -rf deployment/.github deployment/.git

      # Checkout the second site branch into a subfolder
      # - name: Checkout portfolio branch
      #   uses: actions/checkout@v4
      #   with:
      #     ref: portfolio
      #     path: deployment/site2
      #     clean: false

      # Checkout the site/ folder and website_specialist_portfolio.html from the technical-writing repo
      # Needs a PAT: the default GITHUB_TOKEN cannot read other repositories.
      - name: Checkout technical-writing repo (site/ and portfolio)
        uses: actions/checkout@v4
        with:
          repository: rkmanga/technical-writing
          token: ${{ secrets.TECHNICAL_WRITING_TOKEN }}
          path: deployment/_technical-writing-src
          sparse-checkout: |
            site
            website_specialist_portfolio.html
            docs/website_specialist_portfolio.html
          sparse-checkout-cone-mode: false
          clean: false

      # Promote the built MkDocs site and publish website_specialist_portfolio
      - name: Promote technical-writing built site and portfolio page
        run: |
          mv deployment/_technical-writing-src/site deployment/technical-writing
          mkdir -p deployment/technical-writing/website_specialist_portfolio

          # Locate website_specialist_portfolio.html (supports placing it in main repo or technical-writing repo)
          if [ -f "website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="website_specialist_portfolio.html"
          elif [ -f "deployment/_technical-writing-src/website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="deployment/_technical-writing-src/website_specialist_portfolio.html"
          elif [ -f "deployment/_technical-writing-src/docs/website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="deployment/_technical-writing-src/docs/website_specialist_portfolio.html"
          elif [ -f "deployment/technical-writing/website_specialist_portfolio.html" ]; then
            PORTFOLIO_SRC="deployment/technical-writing/website_specialist_portfolio.html"
          else
            echo "Error: website_specialist_portfolio.html not found!"
            exit 1
          fi

          # Publish to both /website_specialist_portfolio/index.html (clean URL) and /website_specialist_portfolio.html
          cp "$PORTFOLIO_SRC" deployment/technical-writing/website_specialist_portfolio/index.html
          cp "$PORTFOLIO_SRC" deployment/technical-writing/website_specialist_portfolio.html

          rm -rf deployment/_technical-writing-src

      # Upload the combined deployment directory as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

      # Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
